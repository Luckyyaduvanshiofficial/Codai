name: Build and Release CodaiPro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v3.0.0)'
        required: true
        default: 'v3.0.0'

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil pyinstaller

    - name: Download llama-server engine (Windows CPU)
      shell: pwsh
      run: |
        $releases = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=20"
        $release = $releases | Where-Object { $_.assets.Count -gt 3 } | Select-Object -First 1
        $asset = $release.assets | Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } | Select-Object -First 1
        if (-not $asset) { throw "No Windows CPU engine asset found" }
        Write-Host "Downloading engine: $($asset.name)"
        Invoke-WebRequest $asset.browser_download_url -OutFile engine.zip
        # Flatten: the llama.cpp zip nests files inside its own folder
        New-Item -ItemType Directory -Force -Path engine | Out-Null
        Expand-Archive engine.zip -DestinationPath engine_tmp
        Get-ChildItem engine_tmp -Recurse -File | ForEach-Object { Copy-Item $_.FullName engine/ }
        Remove-Item engine_tmp -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item engine.zip -Force -ErrorAction SilentlyContinue
        Get-ChildItem engine | Select-Object -First 10
        if (-not (Test-Path "engine/llama-server.exe")) { throw "llama-server.exe missing after extraction" }

    - name: Build Codai.exe
      run: |
        python -m PyInstaller Codai.spec

    - name: Assemble portable package
      shell: pwsh
      run: |
        $dest = "portable\CodaiPro"
        New-Item -ItemType Directory -Force -Path "$dest\engine", "$dest\models" | Out-Null
        Copy-Item "dist\Codai.exe" $dest
        Copy-Item -Recurse -Force "dev" "$dest\dev"
        Copy-Item -Recurse -Force "ui" "$dest\ui"
        Copy-Item -Recurse -Force "engine" "$dest\engine"
        Copy-Item "config.json", "run.bat", "kill.bat", "help.txt" $dest
        $modelReadme = @"
        Drop ONE .gguf model file in this folder, then double-click run.bat.

        Default model expected by config.json:
          gemma-3-1b-it-Q4_K_M.gguf  (0.81 GB)
          https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF

        Other good picks (see the website guide):
          Qwen3.5-0.8B (0.58 GB) - newest
          Qwen3-0.6B   (0.48 GB)
          Llama 3.2 1B (0.81 GB)
          Phi-3.5-mini (2.3 GB)
          Qwen2.5-Coder-3B / 7B - best coding quality

        Using a different filename? Set "model_name" in config.json.
        Full guide: https://luckyyaduvanshiofficial.github.io/Codai/#download
        "@
        Set-Content -Path "$dest\models\README.txt" -Value $modelReadme
        Write-Host "Portable package assembled:"
        Get-ChildItem -Recurse $dest -File | Measure-Object -Property Length -Sum | ForEach-Object { "{0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path "portable\*" -DestinationPath "CodaiPro-${{ env.VERSION }}-Portable-Windows.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodaiPro-Windows-Portable
        path: CodaiPro-${{ env.VERSION }}-Portable-Windows.zip

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: CodaiPro-Windows-Portable

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: CodaiPro ${{ env.VERSION }}
        body: |
          ## CodaiPro ${{ env.VERSION }} — Codai Pro

          The biggest upgrade yet: the desktop GUI is gone. Codai now runs the official `llama-server` engine with a fast browser chat UI — one process to launch, streaming answers, and a controller that watches and restarts the engine if it ever crashes.

          ### New architecture
          - Real llama.cpp engine: `llama-server` runs locally, chat streams token by token
          - Browser UI with markdown rendering, code copy buttons, stop button, and conversation memory
          - Controller with health monitoring, auto-restart, hardware-aware tuning (RAM/CPU tiers), rotating logs and crash reports
          - Single portable folder: unzip, add a model, double-click `run.bat`

          ### In the box
          - `Codai.exe` (packaged controller), `engine\llama-server.exe` (official llama.cpp build)
          - `run.bat` starts everything, waits for readiness, opens your browser
          - `kill.bat` force-cleans Codai processes and locks

          ### First run
          1. Unzip anywhere writable (not `C:\Program Files`)
          2. Drop one model into `models\` — default is `gemma-3-1b-it-Q4_K_M.gguf` (0.81 GB); see the [model guide](https://luckyyaduvanshiofficial.github.io/Codai/#download)
          3. Double-click `run.bat` and wait for `[READY]`

          ### System requirements
          - Windows 10/11 (64-bit)
          - 4 GB RAM minimum (2 GB works with the smallest models)
          - ~1 GB free for the app + 0.5–5 GB for one model

          **Full changelog**: https://github.com/Luckyyaduvanshiofficial/Codai/compare/v2.1.2...${{ env.VERSION }}
        draft: false
        prerelease: false
        files: CodaiPro-${{ env.VERSION }}-Portable-Windows.zip
