name: Build and Release CodaiPro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.1.1)'
        required: true
        default: 'v2.1.1'

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Ensure models folder exists
      run: mkdir models

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        python -m PyInstaller --onedir --windowed --name "CodaiPro_v21" --noconsole --add-data "models;models" --hidden-import="uvicorn" --hidden-import="fastapi" --hidden-import="llama_cpp" --hidden-import="customtkinter" --hidden-import="tkinter" --hidden-import="requests" --hidden-import="json" --hidden-import="threading" --hidden-import="queue" --hidden-import="time" --hidden-import="os" --hidden-import="sys" --hidden-import="ctypes" --hidden-import="socket" --collect-all="customtkinter" --collect-all="llama_cpp" launcher.py

    - name: Create portable package
      run: |
        mkdir portable
        xcopy /e /i /q "dist\CodaiPro_v21" "portable\CodaiPro_v21"

    - name: Create ZIP archive
      run: |
        powershell Compress-Archive -Path "portable\*" -DestinationPath "CodaiPro-${{ env.VERSION }}-Portable-Windows.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodaiPro-Windows-Portable
        path: CodaiPro-${{ env.VERSION }}-Portable-Windows.zip

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: CodaiPro-Windows-Portable

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: CodaiPro ${{ env.VERSION }}
        body: |
          ## CodaiPro ${{ env.VERSION }}

          New recommended models for weak lab PCs, and cleaner answers from thinking models.

          ### New
          - Four sub-1 GB models join the recommended list and run on almost any lab PC: **Qwen3.5-0.8B** (newest), Qwen3-0.6B, Gemma 3 1B Instruct, Llama 3.2 1B Instruct — with direct download links on the website and in `DOWNLOAD_MODEL.bat`
          - Thinking models (Qwen3 / Qwen3.5) no longer show their scratchpad: the `<think>` block is stripped and you get the answer. If the model runs out of tokens mid-thought, you get a clear hint instead of an empty reply

          ### Fixed in v2.1.1 (recap)
          - Fresh installs work again: all backend dependencies are declared
          - AI engine upgraded to llama-cpp-python 0.3.x; every model gets its own chat template
          - Single-instance guard watches the real backend port (8765); lockfiles are cleaned on exit; no duplicate backend spawn
          - Generation timeout raised to 300 s; optional GPU offload via `CODAIPRO_GPU_LAYERS`

          ### First run
          1. Download a model into the `models` folder — sub-1 GB picks and direct links: https://luckyyaduvanshiofficial.github.io/Codai/#download
          2. Run `CodaiPro_v21.exe`

          ### System requirements
          - Windows 10/11 (64-bit)
          - 4 GB RAM minimum
          - 2 GB free storage + 0.5–5 GB for one model

          **Full changelog**: https://github.com/Luckyyaduvanshiofficial/Codai/compare/git-tag-v2.1.0...${{ env.VERSION }}
        draft: false
        prerelease: false
        files: CodaiPro-${{ env.VERSION }}-Portable-Windows.zip
